<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>My Clock</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080b10;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      min-height: 100vh;
      padding: 25px;

      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }

    /* CLOCK */

    .clock {
      background: #111720;
      border-radius: 30px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      min-height: 500px;
    }

    #time {
      font-size: clamp(70px, 13vw, 170px);
      font-weight: 200;
      letter-spacing: -5px;
    }

    #date {
      color: #9ca7b5;
      font-size: 25px;
      margin-top: 15px;
    }

    /* RIGHT SIDE */

    .side {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: #111720;
      border-radius: 25px;
      padding: 25px;
    }

    .title {
      color: #9ca7b5;
      font-size: 20px;
      margin-bottom: 15px;
    }

    /* WEATHER */

    .weather {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .weather-icon {
      font-size: 60px;
    }

    .temperature {
      font-size: 55px;
    }

    .condition {
      color: #9ca7b5;
      font-size: 18px;
    }

    /* ALARM */

    .alarm-time {
      font-size: 40px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 15px;

      border: none;
      border-radius: 14px;

      background: #2563eb;
      color: white;

      font-size: 18px;
      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }

    /* SETTINGS */

    .setting {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 12px 0;

      color: #d1d5db;
    }

    /* MOBILE / PORTRAIT */

   @media (orientation: landscape) {
  .app {
    display: grid;
    grid-template-columns: 1fr 1.5fr;
    grid-template-rows: auto auto;
  }

  .clock {
    grid-column: 2;
    grid-row: 1 / 3;
    min-height: calc(100vh - 50px);
  }

  .side {
    grid-column: 1;
    grid-row: 1 / 3;
  }


    /* FIRE TABLET LANDSCAPE */

    @media (min-width: 700px) and (max-height: 600px) {

      .app {
        padding: 15px;
        gap: 15px;
      }

      .clock {
        min-height: calc(100vh - 30px);
      }

    }

  </style>
</head>

<body>

  <div class="app">

    <!-- CLOCK -->

    <div class="clock">

      <div id="time">
        12:00
      </div>

      <div id="date">
        Loading...
      </div>

    </div>


    <!-- SIDE PANELS -->

    <div class="side">

      <!-- WEATHER -->

      <div class="card">

        <div class="title">
          WEATHER
        </div>

        <div class="weather">

          <div>

            <div class="temperature">
              72°
            </div>

            <div class="condition">
              Partly Cloudy
            </div>

          </div>

          <div class="weather-icon">
            🌤️
          </div>

        </div>

      </div>


      <!-- ALARM -->

      <div class="card">

        <div class="title">
          ALARM
        </div>

        <div class="alarm-time">
          7:00 AM
        </div>

        <button onclick="toggleAlarm()">
          <span id="alarmButton">
            Turn Off
          </span>
        </button>

      </div>


      <!-- SETTINGS -->

      <div class="card">

        <div class="title">
          SETTINGS
        </div>

        <div class="setting">
          <span>24 Hour Clock</span>
          <span>OFF</span>
        </div>

        <div class="setting">
          <span>Night Mode</span>
          <span>OFF</span>
        </div>

      </div>

    </div>

  </div>


  <script>

    /* CLOCK */

    function updateClock() {

      const now = new Date();

      let hours = now.getHours();

      const minutes =
        String(now.getMinutes())
        .padStart(2, "0");

      const seconds =
        String(now.getSeconds())
        .padStart(2, "0");

      const ampm =
        hours >= 12 ? "PM" : "AM";

      hours =
        hours % 12 || 12;

      document.getElementById("time")
        .textContent =
        `${hours}:${minutes}:${seconds} ${ampm}`;

      document.getElementById("date")
        .textContent =
        now.toLocaleDateString(
          undefined,
          {
            weekday: "long",
            month: "long",
            day: "numeric"
          }
        );

    }

    updateClock();

    setInterval(updateClock, 1000);


    /* ALARM BUTTON */

    let alarmOn = true;

    function toggleAlarm() {

      alarmOn = !alarmOn;

      document.getElementById("alarmButton")
        .textContent =
        alarmOn ? "Turn Off" : "Turn On";

    }

  </script>

</body>
</html>
