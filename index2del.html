<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no">

  <title>Fire Tablet Clock</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background: #080b10;
      color: white;

      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================
       MAIN APP
    ========================= */

    .app {
      min-height: 100vh;

      padding: 25px;

      display: grid;

      grid-template-columns: 1fr 2fr;

      gap: 20px;
    }


    /* =========================
       LEFT SIDE
    ========================= */

    .left-side {
      display: flex;
      flex-direction: column;

      gap: 20px;
    }


    /* =========================
       RIGHT SIDE
    ========================= */

    .right-side {
      display: flex;
      flex-direction: column;

      gap: 20px;

      min-width: 0;
    }


    /* =========================
       CLOCK
    ========================= */

    .clock {
      flex: 1;

      min-height: 55vh;

      background: #111720;

      border-radius: 30px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      text-align: center;

      border: 1px solid #1e2733;

      box-shadow:
        0 10px 40px rgba(0,0,0,.35);
    }

    #time {
      font-size: clamp(60px, 10vw, 150px);

      font-weight: 200;

      letter-spacing: -5px;

      line-height: 1;
    }

    #date {
      margin-top: 25px;

      color: #9ca7b5;

      font-size: clamp(18px, 2.5vw, 28px);
    }


    /* =========================
       WEATHER
    ========================= */

    .weather {
      background: #111720;

      border-radius: 30px;

      padding: 25px;

      border: 1px solid #1e2733;
    }

    .weather-header {
      display: flex;

      justify-content: space-between;

      align-items: center;
    }

    .location {
      color: #9ca7b5;

      font-size: 20px;
    }

    .weather-icon {
      font-size: 60px;
    }

    .temperature {
      font-size: 55px;

      font-weight: 300;

      margin-top: 5px;
    }

    .condition {
      color: #9ca7b5;

      font-size: 18px;

      margin-top: 5px;
    }

    .weather-details {
      display: flex;

      gap: 25px;

      margin-top: 20px;

      color: #9ca7b5;

      flex-wrap: wrap;
    }


    /* =========================
       CARDS
    ========================= */

    .card {
      background: #111720;

      border-radius: 25px;

      padding: 25px;

      border: 1px solid #1e2733;
    }

    .title {
      color: #9ca7b5;

      font-size: 18px;

      letter-spacing: 1px;

      margin-bottom: 18px;
    }


    /* =========================
       ALARM
    ========================= */

    .alarm-time {
      font-size: 40px;

      margin-bottom: 18px;
    }

    button {
      width: 100%;

      padding: 15px;

      border: none;

      border-radius: 14px;

      background: #2563eb;

      color: white;

      font-size: 18px;

      cursor: pointer;

      touch-action: manipulation;
    }

    button:active {
      transform: scale(.97);
    }


    /* =========================
       SETTINGS
    ========================= */

    .setting {
      display: flex;

      justify-content: space-between;

      align-items: center;

      padding: 12px 0;

      color: #d1d5db;
    }


    /* =========================
       PORTRAIT / SMALL SCREEN
    ========================= */

    @media (max-width: 700px) {

      .app {
        grid-template-columns: 1fr;

        padding: 15px;
      }

      .right-side {
        order: -1;
      }

      .clock {
        min-height: 50vh;
      }

      .left-side {
        display: grid;

        grid-template-columns: 1fr 1fr;
      }

    }


    /* =========================
       SMALL LANDSCAPE TABLET
    ========================= */

    @media (min-width: 700px) and (max-height: 600px) {

      .app {
        padding: 15px;

        gap: 15px;
      }

      .clock {
        min-height: 55vh;
      }

    }

  </style>
</head>


<body>


<div class="app">


  <!-- =================================
       LEFT SIDE
  ================================== -->

  <div class="left-side">


    <!-- ALARM -->

    <div class="card">

      <div class="title">
        ⏰ ALARM
      </div>

      <div class="alarm-time">
        7:00 AM
      </div>

      <button onclick="toggleAlarm()">

        <span id="alarmButton">
          Turn Off
        </span>

      </button>

    </div>


    <!-- SETTINGS -->

    <div class="card">

      <div class="title">
        ⚙️ SETTINGS
      </div>

      <div class="setting">

        <span>
          24 Hour Clock
        </span>

        <span>
          OFF
        </span>

      </div>


      <div class="setting">

        <span>
          Night Mode
        </span>

        <span>
          OFF
        </span>

      </div>

    </div>


  </div>


  <!-- =================================
       RIGHT SIDE
  ================================== -->

  <div class="right-side">


    <!-- CLOCK -->

    <div class="clock">

      <div id="time">
        12:00:00 PM
      </div>

      <div id="date">
        Loading...
      </div>

    </div>


    <!-- WEATHER UNDER CLOCK -->

    <div class="weather">

      <div class="weather-header">

        <div>

          <div class="location" id="location">
            Loading location...
          </div>

          <div class="temperature" id="temperature">
            --°
          </div>

          <div class="condition" id="condition">
            Loading weather...
          </div>

        </div>

        <div class="weather-icon" id="weatherIcon">
          🌤️
        </div>

      </div>


      <div class="weather-details">

        <div>
          💧 Humidity:
          <span id="humidity">--</span>%
        </div>

        <div>
          💨 Wind:
          <span id="wind">--</span> mph
        </div>

      </div>

    </div>


  </div>


</div>


<script>


  /* =================================
     CLOCK
  ================================= */

  function updateClock() {

    const now = new Date();

    let hours = now.getHours();

    const minutes =
      String(now.getMinutes())
      .padStart(2, "0");

    const seconds =
      String(now.getSeconds())
      .padStart(2, "0");

    const ampm =
      hours >= 12
        ? "PM"
        : "AM";

    hours =
      hours % 12 || 12;


    document.getElementById("time")
      .textContent =
      `${hours}:${minutes}:${seconds} ${ampm}`;


    document.getElementById("date")
      .textContent =
      now.toLocaleDateString(
        undefined,
        {
          weekday: "long",
          month: "long",
          day: "numeric",
          year: "numeric"
        }
      );

  }


  updateClock();

  setInterval(updateClock, 1000);


  /* =================================
     ALARM BUTTON
  ================================= */

  let alarmOn = true;


  function toggleAlarm() {

    alarmOn = !alarmOn;


    document.getElementById("alarmButton")
      .textContent =
      alarmOn
        ? "Turn Off"
        : "Turn On";

  }


  /* =================================
     WEATHER
     OPEN-METEO
  ================================= */

  async function loadWeather() {

    /*
      Springfield, Illinois

      You can change these coordinates
      later for another location.
    */

    const latitude = 39.7817;

    const longitude = -89.6501;


    const url =
      "https://api.open-meteo.com/v1/forecast" +

      `?latitude=${latitude}` +

      `&longitude=${longitude}` +

      "&current=" +
      "temperature_2m," +
      "relative_humidity_2m," +
      "weather_code," +
      "wind_speed_10m" +

      "&temperature_unit=fahrenheit" +

      "&wind_speed_unit=mph" +

      "&timezone=auto";


    try {

      const response =
        await fetch(url);


      if (!response.ok) {

        throw new Error(
          "Weather request failed"
        );

      }


      const data =
        await response.json();


      const current =
        data.current;


      /* LOCATION */

      document.getElementById("location")
        .textContent =
        "Springfield, Illinois";


      /* TEMPERATURE */

      document.getElementById("temperature")
        .textContent =
        Math.round(
          current.temperature_2m
        ) + "°";


      /* HUMIDITY */

      document.getElementById("humidity")
        .textContent =
        current.relative_humidity_2m;


      /* WIND */

      document.getElementById("wind")
        .textContent =
        Math.round(
          current.wind_speed_10m
        );


      /* WEATHER CONDITION */

      const weather =
        weatherDescription(
          current.weather_code
        );


      document.getElementById("condition")
        .textContent =
        weather.text;


      document.getElementById("weatherIcon")
        .textContent =
        weather.icon;


    } catch (error) {

      console.error(error);

      document.getElementById("condition")
        .textContent =
        "Weather unavailable";

    }

  }


  /* =================================
     WEATHER CODES
  ================================= */

  function weatherDescription(code) {

    if (code === 0) {

      return {
        text: "Clear sky",
        icon: "☀️"
      };

    }


    if ([1, 2, 3].includes(code)) {

      return {
        text: "Partly cloudy",
        icon: "🌤️"
      };

    }


    if ([45, 48].includes(code)) {

      return {
        text: "Fog",
        icon: "🌫️"
      };

    }


    if (
      [51, 53, 55, 56, 57]
      .includes(code)
    ) {

      return {
        text: "Drizzle",
        icon: "🌦️"
      };

    }


    if (
      [61, 63, 65, 66, 67]
      .includes(code)
    ) {

      return {
        text: "Rain",
        icon: "🌧️"
      };

    }


    if (
      [71, 73, 75, 77]
      .includes(code)
    ) {

      return {
        text: "Snow",
        icon: "❄️"
      };

    }


    if (
      [80, 81, 82]
      .includes(code)
    ) {

      return {
        text: "Rain showers",
        icon: "🌦️"
      };

    }


    if (
      [95, 96, 99]
      .includes(code)
    ) {

      return {
        text: "Thunderstorm",
        icon: "⛈️"
      };

    }


    return {
      text: "Unknown",
      icon: "🌡️"
    };

  }


  /* =================================
     START WEATHER
  ================================= */

  loadWeather();


  /* Refresh weather every 10 minutes */

  setInterval(
    loadWeather,
    10 * 60 * 1000
  );


</script>


</body>
</html>
