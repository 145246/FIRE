<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no">

  <title>Fire Tablet Clock</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080b10;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* MAIN LAYOUT */

    .app {
      min-height: 100vh;
      padding: 25px;

      display: grid;

      /* LEFT = controls
         RIGHT = clock */
      grid-template-columns: 1fr 2fr;

      gap: 20px;
    }


    /* LEFT SIDE */

    .side {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }


    /* CLOCK */

    .clock {
      background: #111720;

      border-radius: 30px;

      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;

      min-height: calc(100vh - 50px);

      box-shadow:
        0 10px 40px rgba(0,0,0,.35);
    }

    #time {
      font-size: clamp(60px, 10vw, 150px);

      font-weight: 200;

      letter-spacing: -5px;

      text-align: center;
    }

    #date {
      color: #9ca7b5;

      font-size: clamp(18px, 2.5vw, 28px);

      margin-top: 20px;

      text-align: center;
    }


    /* CARDS */

    .card {
      background: #111720;

      border-radius: 25px;

      padding: 25px;

      border: 1px solid #1e2733;
    }

    .title {
      color: #9ca7b5;

      font-size: 18px;

      letter-spacing: 1px;

      margin-bottom: 18px;
    }


    /* WEATHER */

    .weather {
      display: flex;

      align-items: center;

      justify-content: space-between;
    }

    .temperature {
      font-size: 55px;

      font-weight: 300;
    }

    .condition {
      color: #9ca7b5;

      font-size: 18px;

      margin-top: 5px;
    }

    .weather-icon {
      font-size: 65px;
    }


    /* WEATHER DETAILS */

    .weather-details {
      display: flex;

      gap: 20px;

      color: #9ca7b5;

      margin-top: 20px;

      flex-wrap: wrap;
    }


    /* ALARM */

    .alarm-time {
      font-size: 40px;

      margin-bottom: 15px;
    }

    button {
      width: 100%;

      padding: 15px;

      border: none;

      border-radius: 14px;

      background: #2563eb;

      color: white;

      font-size: 18px;

      cursor: pointer;

      touch-action: manipulation;
    }

    button:active {
      transform: scale(.97);
    }


    /* SETTINGS */

    .setting {
      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 12px 0;

      color: #d1d5db;
    }


    /* MOBILE / PORTRAIT */

    @media (max-width: 700px) {

      .app {
        grid-template-columns: 1fr;
      }

      .clock {
        order: -1;

        min-height: 55vh;
      }

      .side {
        display: grid;

        grid-template-columns: 1fr 1fr;
      }

    }


    /* SMALL LANDSCAPE FIRE TABLET */

    @media (min-width: 700px) and (max-height: 600px) {

      .app {
        padding: 15px;

        gap: 15px;
      }

      .clock {
        min-height: calc(100vh - 30px);
      }

    }

  </style>
</head>


<body>


  <div class="app">


    <!-- ======================
         LEFT SIDE
    ======================= -->

    <div class="side">


      <!-- WEATHER -->

      <div class="card">

        <div class="title">
          WEATHER
        </div>

        <div class="weather">

          <div>

            <div class="temperature">
              72°
            </div>

            <div class="condition">
              Partly Cloudy
            </div>

          </div>

          <div class="weather-icon">
            🌤️
          </div>

        </div>

        <div class="weather-details">

          <div>
            💧 45%
          </div>

          <div>
            💨 8 mph
          </div>

        </div>

      </div>


      <!-- ALARM -->

      <div class="card">

        <div class="title">
          ALARM
        </div>

        <div class="alarm-time">
          7:00 AM
        </div>

        <button onclick="toggleAlarm()">

          <span id="alarmButton">
            Turn Off
          </span>

        </button>

      </div>


      <!-- SETTINGS -->

      <div class="card">

        <div class="title">
          SETTINGS
        </div>

        <div class="setting">

          <span>
            24 Hour Clock
          </span>

          <span>
            OFF
          </span>

        </div>

        <div class="setting">

          <span>
            Night Mode
          </span>

          <span>
            OFF
          </span>

        </div>

      </div>


    </div>


    <!-- ======================
         RIGHT SIDE CLOCK
    ======================= -->

    <div class="clock">

      <div id="time">
        12:00:00 PM
      </div>

      <div id="date">
        Loading...
      </div>

    </div>


  </div>


  <script>


    /* ======================
       CLOCK
    ======================= */

    function updateClock() {

      const now = new Date();


      let hours =
        now.getHours();


      const minutes =
        String(
          now.getMinutes()
        ).padStart(2, "0");


      const seconds =
        String(
          now.getSeconds()
        ).padStart(2, "0");


      const ampm =
        hours >= 12
          ? "PM"
          : "AM";


      hours =
        hours % 12 || 12;


      document.getElementById(
        "time"
      ).textContent =
        `${hours}:${minutes}:${seconds} ${ampm}`;


      document.getElementById(
        "date"
      ).textContent =
        now.toLocaleDateString(
          undefined,
          {
            weekday: "long",
            month: "long",
            day: "numeric",
            year: "numeric"
          }
        );

    }


    updateClock();


    setInterval(
      updateClock,
      1000
    );


    /* ======================
       ALARM BUTTON
    ======================= */

    let alarmOn = true;


    function toggleAlarm() {

      alarmOn = !alarmOn;


      document.getElementById(
        "alarmButton"
      ).textContent =
        alarmOn
          ? "Turn Off"
          : "Turn On";

    }


  </script>


</body>
</html>
